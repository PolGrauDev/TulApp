<ion-header class="sol-header ion-no-border">
  <ion-toolbar class="sol-toolbar">
    <div class="sol-toolbar__inner">
      <button class="sol-back" (click)="volver()" aria-label="Volver">
        <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon>
      </button>
      <span class="sol-toolbar__title">SOLICITUDES</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="sol-content" [fullscreen]="true">
  <div class="sol-container">

    <!-- Segmento En curso / Pendientes -->
    <div class="sol-segment" role="tablist" aria-label="Filtro de solicitudes">
      <button
        class="sol-segment__btn"
        [class.sol-segment__btn--active]="tabActivo === 'en-curso'"
        (click)="cambiarTab('en-curso')"
        role="tab"
        [attr.aria-selected]="tabActivo === 'en-curso'"
      >
        En curso
      </button>
      <button
        class="sol-segment__btn"
        [class.sol-segment__btn--active]="tabActivo === 'pendientes'"
        (click)="cambiarTab('pendientes')"
        role="tab"
        [attr.aria-selected]="tabActivo === 'pendientes'"
      >
        Pendientes
      </button>
    </div>

    <!-- Lista de solicitudes -->
    <section class="sol-list" aria-label="Listado de solicitudes">

      <ng-container *ngIf="solicitudesFiltradas.length > 0; else sinSolicitudes">
        <div
          *ngFor="let s of solicitudesFiltradas"
          class="sol-card"
          role="article"
          [attr.aria-label]="s.tipo + ' - ' + s.estado"
        >
          <div class="sol-card__icon-wrap">
            <ion-icon [name]="s.icon" aria-hidden="true"></ion-icon>
          </div>

          <div class="sol-card__info">
            <span class="sol-card__tipo">{{ s.tipo }}</span>
            <span class="sol-card__fecha">{{ s.fecha }}</span>
          </div>

          <span
            class="sol-card__badge"
            [ngClass]="'sol-card__badge--' + s.estadoKey"
            [attr.aria-label]="'Estado: ' + s.estado"
          >
            {{ s.estado }}
          </span>
        </div>
      </ng-container>

      <ng-template #sinSolicitudes>
        <div class="sol-empty">
          <ion-icon name="clipboard-outline" aria-hidden="true"></ion-icon>
          <p>No hay solicitudes {{ tabActivo === 'en-curso' ? 'en curso' : 'pendientes' }}</p>
        </div>
      </ng-template>

    </section>

  </div>
</ion-content>
