<ion-header>
  <ion-toolbar>
    <ion-title>Perfil de voluntario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list inset="true">
    <ion-item routerLink="/volunteer/profile/pending" detail="true">
      <ion-icon name="time-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Recados pendientes</h2>
        <ion-note>Ver recados activos por hacer</ion-note>
      </ion-label>
    </ion-item>

    <ion-item routerLink="/volunteer/profile/history" detail="true">
      <ion-icon name="checkmark-done-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Historial</h2>
        <ion-note>Recados completados</ion-note>
      </ion-label>
    </ion-item>

    <ion-item routerLink="/volunteer/profile/settings" detail="true">
      <ion-icon name="settings-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Configuración</h2>
        <ion-note>Nombre, idioma, domicilio y preferencias</ion-note>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
