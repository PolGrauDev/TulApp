<ion-content class="iv-content" [fullscreen]="true">
  <div class="iv-container">

    <!-- Cabecera -->
    <header class="iv-header">
      <!-- <img src="assets/logo-tulapp.svg" alt="TULApp" class="iv-logo" /> -->
      <h1 class="iv-title">¿Qué necesitas hoy?</h1>
    </header>

    <!-- Botón principal -->
    <section class="iv-main-action" aria-label="Acción principal">
      <button
        class="iv-btn-primary"
        (click)="nuevaSolicitud()"
        aria-label="Crear una nueva solicitud de ayuda"
      >
        <ion-icon name="add-circle-outline" aria-hidden="true"></ion-icon>
        <span>Nueva Solicitud</span>
      </button>
    </section>

    <!-- Separador -->
    <div class="iv-divider" role="separator" aria-hidden="true">
      <span>o pide ayuda por</span>
    </div>

    <!-- Botones secundarios -->
    <section class="iv-secondary-actions" aria-label="Otras formas de pedir ayuda">
      <app-btn-telefono ariaLabel="Llamar por teléfono para pedir ayuda"></app-btn-telefono>

      <button
        class="iv-btn-secondary"
        (click)="notaDeVoz()"
        aria-label="Enviar una nota de voz para pedir ayuda"
      >
        <ion-icon name="mic-outline" aria-hidden="true"></ion-icon>
        <span>Nota de Voz</span>
      </button>
    </section>

  </div>
</ion-content>
