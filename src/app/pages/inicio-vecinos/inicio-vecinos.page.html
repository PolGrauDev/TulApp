<ion-content class="iv-content" [fullscreen]="true">
  <div class="iv-container">

    <!-- Cabecera con saludo -->
    <header class="iv-header">
      <h1 class="iv-greeting">Hola, {{ nombreUsuario }}</h1>
      <p class="iv-subtitle">¿En qué podemos ayudarte hoy?</p>
    </header>

    <!-- Botón principal: Nueva Solicitud -->
    <section class="iv-main-action" aria-label="Acción principal">
      <button
        class="iv-btn-primary"
        (click)="nuevaSolicitud()"
        aria-label="Crear una nueva solicitud de ayuda"
      >
        <div class="iv-btn-icon-wrap">
          <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
        </div>
        <span>Nueva<br>Solicitud</span>
      </button>
    </section>

    <!-- Botón secundario: Llamar por teléfono -->
    <section class="iv-secondary-action" aria-label="Otras formas de pedir ayuda">
      <app-btn-telefono ariaLabel="Llamar por teléfono para pedir ayuda"></app-btn-telefono>
    </section>

  </div>
</ion-content>
