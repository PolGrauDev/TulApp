<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/volunteer/profile" text="Perfil"></ion-back-button>
    </ion-buttons>
    <ion-title>Historial de recados</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  @if (recados.length === 0) {
    <div class="empty-state">
      <p>No hay recados completados aún</p>
    </div>
  } @else {
    <ion-list inset="true">
      @for (recado of recados; track recado.id) {
        <ion-item>
          <ion-icon name="checkmark-circle-outline" slot="start" color="success"></ion-icon>
          <ion-label>
            <h2>{{ recado.titulo }}</h2>
            <p>{{ recado.descripcion }}</p>
            <div class="recado-meta">
              <ion-note>
                <ion-icon name="location-outline"></ion-icon>
                {{ recado.ubicacion }}
              </ion-note>
              <ion-note>
                <ion-icon name="calendar-outline"></ion-icon>
                Completado: {{ recado.fechaCompletado }}
              </ion-note>
            </div>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  }

</ion-content>
